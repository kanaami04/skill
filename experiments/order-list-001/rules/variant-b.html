<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注文 — Parcel(案B Balanced)</title>
<style>
:root{
  --bg:#F4F4F1; --panel:#fff; --ink:#16201E; --ink2:#44504D; --mute:#5D6966;
  --line:#E3E5E1; --line2:#C8CDC8; --accent:#0B6B63; --tint:#E6F1EF; --hover:#F7F8F6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{top:8px}
.num{text-align:right}
.muted{color:var(--mute)}

.app{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:100vh}

/* 左ナビ(背景はページと同じ。囲まない) */
.side{padding:20px 12px;display:flex;flex-direction:column}
.brand{display:block;padding:0 12px 18px;font-size:20px;font-weight:800;letter-spacing:.01em;color:var(--ink);text-decoration:none}
.menu-btn{display:none;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);font-weight:600}
.side ul{list-style:none;margin:0;padding:0}
.side nav a{display:block;padding:8px 12px;margin-bottom:2px;border-radius:6px;color:var(--ink2);text-decoration:none}
.side nav a:hover{background:#EAEBE7;color:var(--ink)}
.side nav a[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:700}

main{padding:20px 24px 48px 8px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{margin:0;font-size:26px;line-height:1.25;font-weight:800;letter-spacing:.01em}
.who{margin:0;display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:flex-end;color:var(--ink2);font-size:14px}
.who span:last-child{color:var(--ink);font-weight:600}

.cols{display:grid;grid-template-columns:184px minmax(0,1fr) 400px;gap:20px;align-items:start}

/* 左のレール: 作業の入口と注文状態(囲まない) */
.rail h2{margin:0 0 6px 12px;font-size:13px;font-weight:700;color:var(--mute)}
.rail .grp{margin:0 0 22px;padding:0;list-style:none}
.q{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;padding:7px 12px;border:0;border-radius:6px;background:none;text-align:left;color:var(--ink2);cursor:pointer}
.q:hover{background:#EAEBE7;color:var(--ink)}
.q .n{color:var(--mute)}
.q[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700}
.q[aria-pressed="true"] .n{color:var(--ink)}
.q.focus{font-weight:700;color:var(--ink);padding-top:9px;padding-bottom:9px}
.q.focus .n{color:var(--accent);font-size:22px;font-weight:800;line-height:1}
.q .l{display:flex;align-items:center}

/* 中央: 注文リスト(囲む) */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.p-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;height:40px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
.search input::placeholder{color:var(--mute)}
.tools{position:sticky;top:0;z-index:5;background:var(--panel);display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 16px;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.tools label{display:flex;align-items:center;gap:8px;color:var(--ink2);cursor:pointer}
.tools .status{margin:0;flex:1 1 auto;color:var(--ink2);min-width:0}
.tools .status b{color:var(--ink)}
.tools .why{flex:1 0 100%;margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.tools .why[hidden]{display:none}
input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.btn{height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:#0A1210}
.btn:disabled{background:#ECEEEB;border-color:var(--line);color:#6F7A77;cursor:not-allowed}
.btn-sm{height:30px;padding:0 10px;font-size:13px}

ul.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:44px minmax(0,1fr);border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .pick{padding:14px 0 0 16px}
.item.is-sel{background:var(--hover)}
.item[aria-current="true"]{background:var(--tint)}
.open{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;width:100%;padding:12px 16px 12px 0;border:0;background:none;text-align:left;cursor:pointer;color:inherit}
.open:hover .id{text-decoration:underline;text-underline-offset:3px}
.eyebrow{grid-column:1/-1;margin-bottom:2px;color:var(--accent);font-weight:700;font-size:14px;line-height:1.4}
.eyebrow span{color:var(--ink2);font-weight:400}
.l1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l1 .id{font-weight:800;margin-right:8px}
.l1 .buyer{font-weight:600;margin-right:8px}
.l1 .prod{color:var(--ink2)}
.amt{text-align:right;font-weight:700}
.l2{display:flex;flex-wrap:wrap;gap:0 10px;color:var(--ink2);font-size:13.5px}
.l2 > span{white-space:nowrap}
.dt{text-align:right;color:var(--mute);font-size:13.5px;white-space:nowrap}
.pay-err{color:var(--accent);font-weight:700}
.pay-err b{font-weight:800}
.pay-due{font-weight:700}
.pay-muted{color:var(--mute)}
.pie{display:inline-block;width:12px;height:12px;border:1.5px solid currentColor;border-radius:50%;margin-right:6px;vertical-align:-1px;flex:none}
.pie.s1{background:conic-gradient(currentColor 0 25%,transparent 0)}
.pie.s2{background:conic-gradient(currentColor 0 50%,transparent 0)}
.pie.s3{background:conic-gradient(currentColor 0 75%,transparent 0)}
.pie.s4{background:currentColor}
.pie.sx{background:linear-gradient(135deg,transparent 42%,currentColor 42% 58%,transparent 58%)}
.empty{padding:48px 16px;text-align:center;color:var(--ink2)}
.empty p{margin:0 0 4px}
.empty .t{font-size:17px;font-weight:700;color:var(--ink)}
.empty .btn{margin-top:14px}

/* 右: 詳細(囲む。画面に付いてくる) */
.detail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
.d-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.d-head h2{margin:0;flex:1;min-width:0;font-size:18px;line-height:1.4;font-weight:800}
.d-head h2:focus{outline:none}
.d-head .btn{display:none}
.d-body{padding:2px 20px 24px}
.d-body section{padding:14px 0;border-bottom:1px solid var(--line)}
.d-body h3{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--mute)}
.d-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.d-state{margin:0;display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center;font-weight:600}
.d-total{margin:0;font-size:24px;font-weight:800}
.d-attn h3{color:var(--accent);font-size:14px}
.d-attn ul{list-style:none;margin:0;padding:0}
.d-attn li{margin:0 0 6px}
.d-attn b{display:block;color:var(--accent);font-size:16px}
.d-attn span{color:var(--ink2)}
.d-lines{width:100%;border-collapse:collapse}
.d-lines th,.d-lines td{padding:6px 0;text-align:left;font-weight:400;font-size:14.5px}
.d-lines thead th{font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.d-lines th.num,.d-lines td.num{text-align:right;padding-left:10px}
.d-lines tfoot tr:first-child th,.d-lines tfoot tr:first-child td{padding-top:10px}
.d-lines tfoot th{color:var(--ink2)}
.d-lines tr.sum th,.d-lines tr.sum td{font-weight:800;color:var(--ink);border-top:1px solid var(--line)}
.d-info{margin:0;display:grid;gap:6px}
.d-info div{display:grid;grid-template-columns:88px 1fr;gap:8px}
.d-info dt{color:var(--mute)}
.d-info dd{margin:0}
.d-note{margin:0}
.d-next{margin:14px 0 0}
.d-body .btn{margin-top:12px;width:100%;height:42px}
.d-empty{padding:40px 20px;text-align:center;color:var(--ink2)}

/* 狭い画面 */
@media (max-width:1199px){
  .cols{grid-template-columns:168px minmax(0,1fr) 340px;gap:16px}
  .l1 .prod{display:none}
}
@media (max-width:979px){
  .app{display:block}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 16px 6px}
  .brand{padding:0}
  .menu-btn{display:block;margin-left:auto}
  .side nav{flex:1 0 100%;display:none;padding:8px 0 4px}
  .side nav.open{display:block}
  main{padding:6px 16px 40px}
  .head{flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:12px}
  .who{justify-content:flex-start;font-size:13px}
  .cols{display:block}
  /* レールは横に並べて、スクロールする */
  .rail{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:thin}
  .rail h2{display:none}
  .rail .grp{display:flex;gap:6px;margin:0}
  .rail .grp + .grp{padding-left:6px;margin-left:2px}
  .q{width:auto;flex:none;white-space:nowrap;border:1px solid var(--line2);background:var(--panel);padding:7px 12px;gap:8px}
  .q.focus{padding:6px 12px}
  .q.focus .n{font-size:18px}
  .q[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .q[aria-pressed="true"] .n{color:#fff}
  .l1 .prod{display:inline}
  .detail{display:none;position:static;max-height:none;overflow:visible}
  .show-detail .detail{display:block}
  .show-detail .rail,.show-detail .listcol{display:none}
  .d-head .btn{display:block}
  .d-head{position:sticky;top:0;background:var(--panel);z-index:3;border-radius:10px 10px 0 0}
  .tools{padding:10px 12px}
  .p-head{padding:12px}
}
@media (max-width:480px){
  .l1 .prod{display:none}
  .item{grid-template-columns:40px minmax(0,1fr)}
  .item .pick{padding-left:12px}
  .l2{font-size:13px}
}
</style>
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<div class="app">
  <div class="side">
    <a class="brand" href="#">Parcel</a>
    <button type="button" class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">メニュー</button>
    <nav id="nav" aria-label="メインメニュー">
      <ul>
        <li><a href="#">ホーム</a></li>
        <li><a href="#" aria-current="page">注文</a></li>
        <li><a href="#">商品</a></li>
        <li><a href="#">在庫</a></li>
        <li><a href="#">顧客</a></li>
        <li><a href="#">設定</a></li>
      </ul>
    </nav>
  </div>

  <main id="main">
    <header class="head">
      <h1>注文</h1>
      <p class="who"><span>灯台珈琲</span><span id="today"></span><span>森田 恵</span></p>
    </header>

    <div class="cols" id="cols">
      <div class="rail" id="rail">
        <div>
          <h2 id="h-today">今日やること</h2>
          <ul class="grp" aria-labelledby="h-today" id="railToday"></ul>
        </div>
        <div>
          <h2 id="h-state">注文状態</h2>
          <ul class="grp" aria-labelledby="h-state" id="railState"></ul>
        </div>
      </div>

      <section class="panel listcol" aria-label="注文一覧">
        <div class="p-head">
          <form class="search" role="search" onsubmit="return false">
            <label class="sr" for="q">注文番号・購入者名・商品名で検索</label>
            <input id="q" type="search" placeholder="注文番号・購入者名・商品名" autocomplete="off">
          </form>
        </div>
        <div class="tools" id="tools">
          <label><input type="checkbox" id="pickAll"> すべて選択</label>
          <p class="status" id="selText" role="status"></p>
          <button type="button" class="btn btn-primary" id="advance" aria-describedby="selText">発送準備中にする</button>
          <p class="why" id="why" hidden></p>
        </div>
        <ul class="items" id="items"></ul>
        <div class="empty" id="empty" hidden>
          <p class="t">条件に合う注文はありません</p>
          <p id="emptyCond"></p>
          <button type="button" class="btn" id="clear">検索と絞り込みを解除</button>
        </div>
      </section>

      <aside class="panel detail" id="detail" aria-label="注文の詳細">
        <div class="d-head">
          <button type="button" class="btn btn-sm" id="dBack">← 一覧に戻る</button>
          <h2 id="dTitle" tabindex="-1"></h2>
        </div>
        <div class="d-body" id="dBody"></div>
      </aside>
    </div>
  </main>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>
/* ===== 共通データと業務ロジック(全案で同一) ===== */
const Core = (() => {
  const TODAY = { y: 2026, m: 10, d: 16, num: 1016, label: '2026年10月16日(金)', time: '10:30' };
  const PRICE = {
    '深煎りブレンド 200g': 1480, '浅煎りブレンド 200g': 1480, 'エチオピア 200g': 1780,
    'カフェインレス 200g': 1600, 'ドリップバッグ 10個入': 1620, 'ギフトセット(豆2種)': 4800,
  };
  const STATES = ['新規', '確認済み', '発送準備中', '発送済み', '配達完了', 'キャンセル'];
  // 並び: 新しい順
  const RAW = [
    ['10248', '10/16 09:52', '山本 葵', '東京都 世田谷区', [['深煎りブレンド 200g', 2]], 3560, 'クレジットカード', '入金済み', '新規', '宅配便', null, '10/18', ''],
    ['10247', '10/16 08:15', '佐々木 大輔', '神奈川県 横浜市', [['ドリップバッグ 10個入', 1]], 1820, 'コンビニ払い', '未入金', '新規', 'メール便', '10/19', '入金後', ''],
    ['10246', '10/16 01:40', '中村 由衣', '大阪府 大阪市', [['ギフトセット(豆2種)', 1]], 5400, 'クレジットカード', '決済エラー', '新規', '宅配便', null, null, 'カードの承認エラー。購入者への連絡が必要'],
    ['10245', '10/15 21:03', '小林 誠', '埼玉県 さいたま市', [['エチオピア 200g', 1], ['浅煎りブレンド 200g', 1]], 3860, 'クレジットカード', '入金済み', '確認済み', '宅配便', null, '10/17', '配達日時指定: 10/18 午前'],
    ['10244', '10/15 18:47', '加藤 美咲', '愛知県 名古屋市', [['ドリップバッグ 10個入', 3]], 5460, 'クレジットカード', '入金済み', '確認済み', '宅配便', null, '10/17', 'ギフト包装'],
    ['10243', '10/15 12:30', '吉田 健太', '福岡県 福岡市', [['深煎りブレンド 200g', 1]], 1680, '銀行振込', '未入金', '確認済み', 'メール便', '10/18', '入金後', ''],
    ['10242', '10/15 10:05', '山田 花子', '北海道 札幌市', [['カフェインレス 200g', 2]], 4130, '代金引換', '代引き', '発送準備中', '宅配便', null, '10/16', ''],
    ['10241', '10/14 22:18', '松本 拓也', '千葉県 船橋市', [['浅煎りブレンド 200g', 1]], 1680, 'クレジットカード', '入金済み', '発送準備中', 'メール便', null, '10/16', ''],
    ['10240', '10/14 15:40', '井上 さやか', '京都府 京都市', [['ギフトセット(豆2種)', 2]], 9600, 'クレジットカード', '入金済み', '発送準備中', '宅配便', null, '10/15', 'のし「御礼」。発送期限を1日超過'],
    ['10239', '10/14 09:12', '木村 涼', '宮城県 仙台市', [['エチオピア 200g', 2]], 4160, '銀行振込', '未入金', '確認済み', '宅配便', '10/17', '入金後', ''],
    ['10238', '10/13 20:55', '林 直樹', '広島県 広島市', [['ドリップバッグ 10個入', 1]], 1820, 'コンビニ払い', '未入金', '確認済み', 'メール便', '10/16', '入金後', '支払期限が今日'],
    ['10237', '10/13 14:22', '清水 愛', '東京都 杉並区', [['深煎りブレンド 200g', 2], ['ドリップバッグ 10個入', 1]], 5180, 'クレジットカード', '入金済み', '発送済み', '宅配便', null, '10/15', '10/15 発送'],
    ['10236', '10/13 11:08', '山口 翔', '兵庫県 神戸市', [['浅煎りブレンド 200g', 1]], 1680, 'クレジットカード', '入金済み', '発送済み', 'メール便', null, '10/15', '10/14 発送'],
    ['10235', '10/12 19:30', '森 千尋', '静岡県 静岡市', [['カフェインレス 200g', 1]], 2530, '代金引換', '代引き', '発送済み', '宅配便', null, '10/14', '10/14 発送'],
    ['10234', '10/12 16:44', '池田 悠', '東京都 渋谷区', [['ギフトセット(豆2種)', 1]], 5400, 'クレジットカード', '返金済み', 'キャンセル', '宅配便', null, null, '購入者都合のキャンセル(10/13)'],
    ['10233', '10/12 10:02', '橋本 結衣', '長野県 松本市', [['エチオピア 200g', 1]], 2380, '銀行振込', '入金済み', '発送済み', '宅配便', null, '10/15', '10/13 入金、10/14 発送'],
    ['10232', '10/11 22:40', '阿部 健', '新潟県 新潟市', [['深煎りブレンド 200g', 3]], 5040, 'クレジットカード', '入金済み', '配達完了', '宅配便', null, '10/13', '10/14 配達完了'],
    ['10231', '10/11 13:15', '石川 遥', '東京都 練馬区', [['ドリップバッグ 10個入', 2]], 3440, 'コンビニ払い', '入金済み', '配達完了', 'メール便', null, '10/14', '10/13 配達完了'],
  ];
  const orders = RAW.map(([id, at, buyer, dest, items, total, payMethod, payState, state, ship, payDue, shipDue, note]) =>
    ({ id, at, buyer, dest, items, total, payMethod, payState, state, ship, payDue, shipDue, note }));
  const byId = (id) => orders.find((o) => o.id === id);

  const FILTERS = [
    { key: 'all', label: 'すべて' },
    { key: 'attention', label: '要対応' },
    { key: 'new', label: '新規', state: '新規' },
    { key: 'confirmed', label: '確認済み', state: '確認済み' },
    { key: 'preparing', label: '発送準備中', state: '発送準備中' },
    { key: 'shipped', label: '発送済み', state: '発送済み' },
    { key: 'delivered', label: '配達完了', state: '配達完了' },
    { key: 'canceled', label: 'キャンセル', state: 'キャンセル' },
  ];
  // 補助の絞り込み(必須の8つとは別)
  const EXTRA_FILTERS = [{ key: 'ready', label: '発送準備に進める' }];
  const filterLabel = (key) => [...FILTERS, ...EXTRA_FILTERS].find((f) => f.key === key).label;

  /* ---- 日付 ---- */
  const dayNum = (s) => { const m = /^(\d+)\/(\d+)$/.exec(s || ''); return m ? +m[1] * 100 + +m[2] : null; };
  const daysBefore = (s) => { // s が今日の何日前か(今日=0)
    const m = /^(\d+)\/(\d+)$/.exec(s); const t = Date.UTC(TODAY.y, TODAY.m - 1, TODAY.d);
    return Math.round((t - Date.UTC(TODAY.y, +m[1] - 1, +m[2])) / 86400000);
  };
  const unshipped = (o) => o.state === '新規' || o.state === '確認済み' || o.state === '発送準備中';

  /* ---- 要対応 ---- rank が小さいほど急ぐ */
  function reasons(o) {
    const r = [];
    const sd = dayNum(o.shipDue);
    if (sd && unshipped(o) && sd <= TODAY.num) {
      const n = daysBefore(o.shipDue);
      r.push(n > 0
        ? { key: 'over', rank: 1, label: `発送期限 ${n}日超過`, short: `${n}日超過`, action: '今日中に発送する' }
        : { key: 'today', rank: 3, label: '発送期限 今日', short: '期限 今日', action: '今日中に発送する' });
    }
    if (o.payState === '決済エラー') r.push({ key: 'payerr', rank: 2, label: '決済エラー', short: '決済エラー', action: '購入者に連絡する' });
    const pd = dayNum(o.payDue);
    if (o.payState === '未入金' && pd && pd <= TODAY.num) r.push({ key: 'unpaid', rank: 4, label: pd < TODAY.num ? '支払期限 超過' : '支払期限 今日', short: '支払期限 今日', action: '入金を確認する' });
    if (o.state === '新規') r.push({ key: 'new', rank: 5, label: '新規(未確認)', short: '未確認', action: '内容を確認する' });
    return r.sort((a, b) => a.rank - b.rank);
  }
  const isAttention = (o) => reasons(o).length > 0;
  const topRank = (o) => Math.min(...reasons(o).map((r) => r.rank));
  const byUrgency = (a, b) => topRank(a) - topRank(b) || (a.id < b.id ? 1 : -1);

  /* ---- 発送準備 ---- */
  const canAdvance = (o) => o.state === '確認済み' && (o.payState === '入金済み' || o.payState === '代引き');
  function whyNot(o) {
    if (canAdvance(o)) return '';
    if (o.state === '新規') return '内容の確認が先です(新規)';
    if (o.state === '確認済み') return o.payState === '未入金' ? '入金待ちです' : '支払い状態を確認してください';
    if (o.state === 'キャンセル') return 'キャンセル済みです';
    return `すでに${o.state}です`;
  }

  /* ---- 絞り込み・検索 ---- */
  const norm = (s) => String(s).normalize('NFKC').toLowerCase().replace(/[\s#]+/g, '');
  const hay = (o) => [o.id, o.buyer, ...o.items.map((i) => i[0])].map(norm);
  function inFilter(o, key) {
    if (key === 'all') return true;
    if (key === 'attention') return isAttention(o);
    if (key === 'ready') return canAdvance(o);
    return o.state === FILTERS.find((f) => f.key === key).state;
  }
  function inSearch(o, q) {
    const n = norm(q); if (!n) return true;
    return hay(o).some((f) => f.includes(n)); // 注文番号・購入者名・商品名のどれかに部分一致
  }
  const countOf = (key) => orders.filter((o) => inFilter(o, key)).length;

  /* ---- 金額の内訳(共通データのルールから計算) ---- */
  function breakdown(o) {
    const lines = o.items.map(([name, qty]) => ({ name, qty, unit: PRICE[name], sum: PRICE[name] * qty }));
    const sub = lines.reduce((s, l) => s + l.sum, 0);
    const shipFee = sub >= 5000 ? 0 : (o.ship === '宅配便' ? 600 : 200);
    const cod = o.payMethod === '代金引換' ? 330 : 0;
    return { lines, sub, shipFee, cod, total: sub + shipFee + cod };
  }

  /* ---- 表示用の小さな関数 ---- */
  const yen = (n) => '¥' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const itemsText = (o) => o.items.map(([n, q]) => `${n} ×${q}`).join('、');
  // 注文状態の進捗を形で表す(色に頼らない)。0=新規 … 4=配達完了、x=キャンセル
  const STAGE = { '新規': 0, '確認済み': 1, '発送準備中': 2, '発送済み': 3, '配達完了': 4, 'キャンセル': 'x' };
  const mark = (state) => `<i class="pie s${STAGE[state]}" aria-hidden="true"></i>`;
  const payHTML = (o) => {
    const cls = o.payState === '決済エラー' ? 'pay pay-err' : o.payState === '未入金' ? 'pay pay-due' : o.payState === '返金済み' ? 'pay pay-muted' : 'pay';
    return `<span class="${cls}">${o.payState === '決済エラー' ? '<b aria-hidden="true">!</b> ' : ''}${o.payState}</span>`;
  };
  const dueText = (o) => (o.shipDue ? o.shipDue : '—');

  /* ---- 共通の状態 ---- */
  const store = { filter: 'all', q: '', sel: new Set(), detail: null };
  const visible = () => orders.filter((o) => inFilter(o, store.filter) && inSearch(o, store.q));
  const pruneSel = () => { const v = new Set(visible().map((o) => o.id)); [...store.sel].forEach((id) => { if (!v.has(id)) store.sel.delete(id); }); };
  function selInfo() {
    const picked = orders.filter((o) => store.sel.has(o.id));
    return { n: picked.length, ok: picked.filter(canAdvance), ng: picked.filter((o) => !canAdvance(o)) };
  }
  function advance() {
    const { ok, ng, n } = selInfo();
    if (!n || ng.length) return 0;
    ok.forEach((o) => { o.state = '発送準備中'; });
    store.sel.clear();
    return ok.length;
  }
  function advanceOne(id) { const o = byId(id); if (o && canAdvance(o)) { o.state = '発送準備中'; store.sel.delete(id); return true; } return false; }

  /* ---- 詳細(全案共通の中身。見た目は各案のCSS) ---- */
  function detailHTML(o) {
    const b = breakdown(o); const rs = reasons(o); const ok = canAdvance(o);
    const attention = rs.length ? `
      <section class="d-attn" aria-label="対応が必要な理由">
        <h3>要対応</h3>
        <ul>${rs.map((r) => `<li><b>${esc(r.label)}</b><span>${esc(r.action)}</span></li>`).join('')}</ul>
      </section>` : '';
    const next = ok ? `<p class="d-next">発送準備に進められます。</p>`
      : unshipped(o) || o.state === '新規' ? `<p class="d-next muted">発送準備に進めない理由: ${esc(whyNot(o))}</p>` : '';
    const act = ok ? `<button type="button" class="btn btn-primary" data-advance-one="${o.id}">発送準備中にする</button>` : '';
    return `
      <div class="d-top">
        <p class="d-state">${mark(o.state)}<span>${o.state}</span>${payHTML(o)}</p>
        <p class="d-total">${yen(o.total)}</p>
      </div>
      ${attention}
      <section aria-label="商品の明細">
        <h3>商品の明細</h3>
        <table class="d-lines">
          <thead><tr><th scope="col">商品</th><th scope="col" class="num">単価</th><th scope="col" class="num">数量</th><th scope="col" class="num">小計</th></tr></thead>
          <tbody>${b.lines.map((l) => `<tr><td>${esc(l.name)}</td><td class="num">${yen(l.unit)}</td><td class="num">${l.qty}</td><td class="num">${yen(l.sum)}</td></tr>`).join('')}</tbody>
          <tfoot>
            <tr><th scope="row" colspan="3">商品合計</th><td class="num">${yen(b.sub)}</td></tr>
            <tr><th scope="row" colspan="3">送料(${o.ship})</th><td class="num">${b.shipFee ? yen(b.shipFee) : '無料'}</td></tr>
            ${b.cod ? `<tr><th scope="row" colspan="3">代引き手数料</th><td class="num">${yen(b.cod)}</td></tr>` : ''}
            <tr class="sum"><th scope="row" colspan="3">合計(税込)</th><td class="num">${yen(b.total)}</td></tr>
          </tfoot>
        </table>
      </section>
      <section aria-label="注文情報">
        <h3>注文情報</h3>
        <dl class="d-info">
          <div><dt>購入者</dt><dd>${esc(o.buyer)}</dd></div>
          <div><dt>注文日時</dt><dd>${o.at}</dd></div>
          <div><dt>配送先</dt><dd>${esc(o.dest)}</dd></div>
          <div><dt>配送方法</dt><dd>${o.ship}</dd></div>
          <div><dt>支払方法</dt><dd>${o.payMethod}</dd></div>
          <div><dt>支払期限</dt><dd>${o.payDue || '—'}</dd></div>
          <div><dt>発送期限</dt><dd>${o.shipDue || '—'}</dd></div>
        </dl>
      </section>
      <section aria-label="備考">
        <h3>備考</h3>
        <p class="d-note">${o.note ? esc(o.note) : '<span class="muted">なし</span>'}</p>
      </section>
      ${next}${act}`;
  }

  // 動作確認用(画面には出さない)
  const selfTest = () => ({
    attention: orders.filter(isAttention).map((o) => o.id).sort(),
    ready: orders.filter(canAdvance).map((o) => o.id).sort(),
    totalsOk: orders.every((o) => breakdown(o).total === o.total),
    states: STATES.map((s) => [s, orders.filter((o) => o.state === s).length]),
  });

  return { TODAY, STATES, FILTERS, EXTRA_FILTERS, filterLabel, orders, byId, reasons, isAttention, byUrgency, canAdvance, whyNot, inFilter, inSearch, countOf, breakdown, yen, esc, itemsText, mark, payHTML, dueText, store, visible, pruneSel, selInfo, advance, advanceOne, detailHTML, unshipped, selfTest };
})();


(() => {
  const S = Core.store, $ = (s) => document.querySelector(s);
  const { esc, yen } = Core;
  const narrow = () => matchMedia('(max-width: 979px)').matches;
  $('#today').textContent = `${Core.TODAY.label} ${Core.TODAY.time}`;
  S.filter = 'attention'; // 開いたとき、まず要対応を見せる

  const nav = $('#nav'), menuBtn = $('#menuBtn');
  menuBtn.addEventListener('click', () => {
    const open = nav.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', String(open));
  });
  const announce = (msg) => { $('#live').textContent = ''; setTimeout(() => { $('#live').textContent = msg; }, 30); };

  /* レール */
  const qBtn = (f, cls = '', pie = '') => `<li><button type="button" class="q ${cls}" data-f="${f.key}" aria-pressed="false"><span class="l">${pie}${f.label}</span><span class="n"></span></button></li>`;
  const F = Object.fromEntries([...Core.FILTERS, ...Core.EXTRA_FILTERS].map((f) => [f.key, f]));
  $('#railToday').innerHTML = qBtn(F.attention, 'focus') + qBtn(F.ready);
  $('#railState').innerHTML = ['all', 'new', 'confirmed', 'preparing', 'shipped', 'delivered', 'canceled']
    .map((k) => qBtn(F[k], '', F[k].state ? Core.mark(F[k].state) : '')).join('');
  function renderRail() {
    document.querySelectorAll('.q').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.f === S.filter));
      b.querySelector('.n').textContent = Core.countOf(b.dataset.f);
    });
  }
  $('#rail').addEventListener('click', (e) => {
    const b = e.target.closest('.q'); if (!b) return;
    S.filter = b.dataset.f; Core.pruneSel(); ensureDetail(); renderAll();
  });
  $('#q').addEventListener('input', (e) => { S.q = e.target.value; Core.pruneSel(); ensureDetail(); renderList(); renderDetail(); });
  $('#clear').addEventListener('click', () => { S.filter = 'all'; S.q = ''; $('#q').value = ''; ensureDetail(); renderAll(); $('#q').focus(); });

  /* リスト */
  const sorted = () => { const l = Core.visible(); return S.filter === 'attention' ? l.sort(Core.byUrgency) : l; };
  function itemHTML(o) {
    const rs = Core.reasons(o), picked = S.sel.has(o.id);
    const acts = [...new Set(rs.map((r) => r.action))];
    const eyebrow = rs.length ? `<span class="eyebrow">${esc(rs.map((r) => r.label).join(' / '))} <span>→ ${esc(acts.join('、'))}</span></span>` : '';
    const ready = Core.canAdvance(o) ? '<span><b>発送準備に進める</b></span>' : '';
    return `<li class="item${picked ? ' is-sel' : ''}" data-id="${o.id}"${S.detail === o.id ? ' aria-current="true"' : ''}>
      <div class="pick"><input type="checkbox" data-pick="${o.id}" aria-label="#${o.id} ${esc(o.buyer)} を選択"${picked ? ' checked' : ''}></div>
      <button type="button" class="open" data-open="${o.id}">
        ${eyebrow}
        <span class="l1"><span class="id">#${o.id}</span><span class="buyer">${esc(o.buyer)}</span><span class="prod">${esc(Core.itemsText(o))}</span></span>
        <span class="amt">${yen(o.total)}</span>
        <span class="l2"><span>${Core.mark(o.state)}${o.state}</span><span>${Core.payHTML(o)}</span><span>${o.ship}</span><span>発送期限 ${Core.dueText(o)}</span>${ready}</span>
        <span class="dt">${o.at}</span>
      </button></li>`;
  }
  function renderList() {
    const list = sorted();
    $('#items').innerHTML = list.map(itemHTML).join('');
    $('#items').hidden = !list.length; $('#empty').hidden = list.length > 0;
    if (!list.length) {
      const cond = [S.filter !== 'all' ? `「${Core.filterLabel(S.filter)}」` : '', S.q ? `検索「${S.q}」` : ''].filter(Boolean).join(' と ');
      $('#emptyCond').textContent = cond ? `${cond} に一致する注文がありません。` : '';
    }
    updatePickAll(list); updateBar();
  }
  function updatePickAll(list = Core.visible()) {
    const all = $('#pickAll'), n = list.filter((o) => S.sel.has(o.id)).length;
    all.checked = list.length > 0 && n === list.length; all.indeterminate = n > 0 && n < list.length; all.disabled = !list.length;
  }
  $('#pickAll').addEventListener('change', (e) => {
    Core.visible().forEach((o) => (e.target.checked ? S.sel.add(o.id) : S.sel.delete(o.id)));
    renderList();
  });
  $('#items').addEventListener('change', (e) => {
    const c = e.target.closest('[data-pick]'); if (!c) return;
    c.checked ? S.sel.add(c.dataset.pick) : S.sel.delete(c.dataset.pick);
    c.closest('.item').classList.toggle('is-sel', c.checked);
    updatePickAll(); updateBar();
  });
  $('#items').addEventListener('click', (e) => {
    const b = e.target.closest('[data-open]'); if (b) selectOrder(b.dataset.open, true);
  });

  /* まとめて発送準備へ */
  function updateBar() {
    const { n, ok, ng } = Core.selInfo();
    const why = $('#why'), adv = $('#advance');
    $('#selText').innerHTML = n ? `<b>${n}件</b>を選択中` : '注文が選ばれていません';
    adv.disabled = n === 0 || ng.length > 0;
    adv.textContent = ok.length && !ng.length ? `発送準備中にする(${ok.length}件)` : '発送準備中にする';
    if (ng.length) {
      why.hidden = false;
      why.innerHTML = `<span>発送準備に進めない注文が含まれています: ${ng.map((o) => `<b>#${o.id}</b> ${esc(Core.whyNot(o))}`).join('、')}</span><button type="button" class="btn btn-sm" id="dropNg">進めない注文の選択を外す</button>`;
    } else why.hidden = true;
  }
  $('#tools').addEventListener('click', (e) => {
    if (e.target.id === 'dropNg') { Core.selInfo().ng.forEach((o) => S.sel.delete(o.id)); renderList(); $('#advance').focus(); }
  });
  $('#advance').addEventListener('click', () => {
    const n = Core.advance(); if (!n) return;
    renderAll(); announce(`${n}件を「発送準備中」にしました`);
  });

  /* 詳細(いつも右に出ている。開いたときは、いちばん上の注文) */
  function ensureDetail() {
    const list = sorted();
    if (!list.some((o) => o.id === S.detail)) S.detail = list.length ? list[0].id : null;
  }
  function renderDetail() {
    const o = S.detail && Core.byId(S.detail);
    if (!o) { $('#dTitle').textContent = '注文の詳細'; $('#dBody').innerHTML = '<p class="d-empty">表示できる注文がありません。</p>'; return; }
    $('#dTitle').textContent = `#${o.id} ${o.buyer}`;
    $('#dBody').innerHTML = Core.detailHTML(o);
  }
  function selectOrder(id, focus) {
    S.detail = id; renderList(); renderDetail();
    if (narrow()) { $('#cols').classList.add('show-detail'); window.scrollTo(0, 0); $('#dTitle').focus(); }
  }
  $('#dBack').addEventListener('click', () => {
    $('#cols').classList.remove('show-detail');
    (document.querySelector(`[data-open="${S.detail}"]`) || $('#q')).focus();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && narrow() && $('#cols').classList.contains('show-detail')) $('#dBack').click(); });
  $('#dBody').addEventListener('click', (e) => {
    const b = e.target.closest('[data-advance-one]'); if (!b) return;
    const id = b.dataset.advanceOne;
    if (Core.advanceOne(id)) { renderAll(); announce(`#${id} を「発送準備中」にしました`); $('#dTitle').focus(); }
  });

  function renderAll() { renderRail(); renderList(); renderDetail(); }
  ensureDetail(); renderAll();
})();
</script>
</body>
</html>
