<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注文 — Parcel(案C Presentable)</title>
<style>
:root{
  --bg:#F2F0EA; --panel:#fff; --ink:#14120E; --ink2:#47433B; --mute:#6A655A;
  --line:#E2DED4; --line2:#BCB7AA; --yellow:#FFD21F; --warn:#FFF3BD; --hover:#F8F6F1;
  --nav:#14120E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
nav :focus-visible,.top :focus-visible{outline-color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{top:8px}
.num{text-align:right}
.muted{color:var(--mute)}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}

/* 左ナビ(濃い色。管理画面の慣習どおり左に置く) */
.side{background:var(--nav);color:#ECE9E0;padding:24px 14px;position:sticky;top:0;height:100vh;align-self:start}
.brand{display:block;padding:0 12px 24px;font-size:22px;font-weight:800;letter-spacing:.02em;color:#fff;text-decoration:none}
.menu-btn{display:none;height:38px;padding:0 14px;border:1px solid #6B665C;border-radius:6px;background:transparent;color:#fff;font-weight:600}
.side ul{list-style:none;margin:0;padding:0}
.side nav a{display:block;padding:10px 12px;margin-bottom:2px;border-radius:6px;color:#D5D1C6;text-decoration:none}
.side nav a:hover{background:#2A2720;color:#fff}
.side nav a[aria-current="page"]{background:#2F2B23;color:#fff;font-weight:700}

main{padding:28px 44px 64px;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{margin:0;font-size:32px;line-height:1.2;font-weight:800;letter-spacing:.01em}
.who{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:4px 20px;justify-content:flex-end;color:var(--ink2);font-size:14px}
.who span:last-child{color:var(--ink);font-weight:700}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}

/* 焦点: 要対応 */
.today{padding:26px 32px 10px;margin-bottom:28px}
.today-head{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:8px}
.today h2{margin:0;display:flex;align-items:center;gap:14px;font-size:28px;line-height:1.2;font-weight:800}
.count{display:inline-block;min-width:64px;padding:6px 14px 8px;border-radius:8px;background:var(--yellow);font-size:46px;line-height:1;font-weight:800;text-align:center}
.tasks{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto 20px;gap:2px 20px;align-items:center;width:100%;padding:16px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.tasks li:first-child .task{border-top:0}
.task:hover .act{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.act{font-size:19px;line-height:1.35;font-weight:800}
.who2{grid-column:1;color:var(--ink2);font-size:15px}
.who2 b{color:var(--ink);font-weight:700}
.rsn{grid-column:2;grid-row:1/3;text-align:right;font-weight:700;font-size:15px}
.rsn small{display:block;font-weight:400;color:var(--mute);font-size:13.5px}
.stamp{display:inline-block;background:var(--ink);color:#fff;padding:1px 10px 2px;border-radius:4px;font-weight:800}
.chev{grid-column:3;grid-row:1/3;font-size:22px;color:var(--mute);text-align:right}
.none{padding:18px 0 22px;color:var(--ink2)}

/* 一覧 */
.all{padding:24px 0 0}
.all-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 32px 6px}
h2.t2{margin:0;font-size:22px;font-weight:800}
.search input{width:340px;max-width:100%;height:42px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
.search input::placeholder{color:var(--mute)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;padding:8px 32px 14px;border-bottom:1px solid var(--line)}
.f{display:inline-flex;align-items:center;padding:8px 10px;border:0;border-radius:6px;background:none;color:var(--ink2);cursor:pointer;white-space:nowrap}
.f:hover{background:var(--hover);color:var(--ink)}
.f .n{margin-left:6px;color:var(--mute)}
.f[aria-pressed="true"]{color:var(--ink);font-weight:800;text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:5px;text-underline-offset:5px}
.f[aria-pressed="true"] .n{color:var(--ink)}
.sep{color:var(--line2);padding:0 2px}
.vr{width:1px;height:20px;background:var(--line);margin:0 8px}
.bar{position:sticky;top:0;z-index:5;background:var(--panel);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 32px;border-bottom:1px solid var(--line)}
.bar .status{margin:0;flex:1 1 auto;color:var(--ink2);min-width:0}
.bar .status b{color:var(--ink)}
.bar .why{flex:1 0 100%;margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.bar .why[hidden]{display:none}
.btn{height:40px;padding:0 16px;border:1.5px solid var(--ink);border-radius:8px;background:var(--panel);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#2A2720}
.btn:disabled{background:#EDEBE5;border-color:var(--line2);color:#736E63;cursor:not-allowed}
.btn-sm{height:32px;padding:0 12px;font-size:13.5px}

.tablewrap{overflow-x:auto}
table.list{width:100%;min-width:900px;border-collapse:collapse}
.list th{padding:10px 12px;text-align:left;font-size:13px;font-weight:600;color:var(--mute);border-bottom:1px solid var(--line2);white-space:nowrap}
.list th.num{text-align:right}
.list td{padding:15px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.list tbody tr:last-child td{border-bottom:0}
.list tbody tr.row:hover{background:var(--hover)}
.list tr.is-sel{background:var(--warn)}
.list tr.is-sel:hover{background:var(--warn)}
.list .c-chk{width:64px;padding-left:32px;padding-right:0}
input[type=checkbox]{width:19px;height:19px;margin:2px 0 0;accent-color:var(--ink)}
.c-id{width:120px;white-space:nowrap}
.c-id .sub{display:block;font-size:13.5px;color:var(--mute)}
.link{background:none;border:0;padding:0;font-weight:800;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px}
.link:hover{text-decoration-color:var(--ink)}
.c-who .b{font-weight:700}
.c-who .it{display:block;color:var(--ink2)}
.c-who .rs{display:block;margin-top:2px;font-weight:700}
.c-amt{width:100px;white-space:nowrap;font-weight:600}
.c-state{width:150px}
.c-state .st{display:block;font-weight:600;white-space:nowrap}
.c-state .pay{display:block;color:var(--ink2)}
.c-ship{width:130px;white-space:nowrap}
.c-ship .due{display:block;color:var(--ink2)}
.c-ship .due.hot{color:var(--ink);font-weight:800}
.pay-err{font-weight:800;color:var(--ink)}
.pay-err b{font-weight:800}
.pay-due{font-weight:700}
.pay-muted{color:var(--mute)}
.pie{display:inline-block;width:13px;height:13px;border:1.5px solid currentColor;border-radius:50%;margin-right:7px;vertical-align:-1px}
.pie.s1{background:conic-gradient(currentColor 0 25%,transparent 0)}
.pie.s2{background:conic-gradient(currentColor 0 50%,transparent 0)}
.pie.s3{background:conic-gradient(currentColor 0 75%,transparent 0)}
.pie.s4{background:currentColor}
.pie.sx{background:linear-gradient(135deg,transparent 42%,currentColor 42% 58%,transparent 58%)}
.empty{padding:56px 16px;text-align:center;color:var(--ink2)}
.empty p{margin:0 0 4px}
.empty .t{font-size:18px;font-weight:800;color:var(--ink)}
.empty .btn{margin-top:16px}

/* 詳細(ダイアログ) */
dialog{width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:0;border-radius:14px;background:var(--panel);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(20,18,14,.55)}
.d-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 32px;background:var(--panel);border-bottom:1px solid var(--line)}
.d-head h2{margin:0;font-size:24px;line-height:1.3;font-weight:800;min-width:0}
.d-head h2:focus{outline:none}
.d-head .lbl-m{display:none}
.d-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 40px;padding:0 32px 32px}
.d-top,.d-attn,.d-next,.d-body > .btn{grid-column:1/-1}
.d-body section[aria-label="商品の明細"],.d-body section[aria-label="備考"]{grid-column:1}
.d-body section[aria-label="注文情報"]{grid-column:2;grid-row:span 2}
.d-body section{padding:18px 0 4px}
.d-body h3{margin:0 0 10px;font-size:14px;font-weight:800;color:var(--ink2)}
.d-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 6px}
.d-state{margin:0;display:flex;flex-wrap:wrap;gap:2px 16px;align-items:center;font-weight:700;font-size:16px}
.d-total{margin:0;font-size:30px;font-weight:800}
.d-attn{margin:12px 0 0;padding:16px 20px 12px;background:var(--warn);border-radius:10px}
.d-attn h3{color:var(--ink)}
.d-attn ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.d-attn b{display:block;font-size:18px}
.d-attn span{color:var(--ink2)}
.d-lines{width:100%;border-collapse:collapse}
.d-lines th,.d-lines td{padding:7px 0;text-align:left;font-weight:400}
.d-lines thead th{font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.d-lines th.num,.d-lines td.num{text-align:right;padding-left:12px}
.d-lines tfoot tr:first-child th,.d-lines tfoot tr:first-child td{padding-top:12px}
.d-lines tfoot th{color:var(--ink2)}
.d-lines tr.sum th,.d-lines tr.sum td{font-weight:800;font-size:17px;color:var(--ink);border-top:1px solid var(--line)}
.d-info{margin:0;display:grid;gap:8px}
.d-info div{display:grid;grid-template-columns:84px 1fr;gap:8px}
.d-info dt{color:var(--mute)}
.d-info dd{margin:0}
.d-note{margin:0}
.d-next{margin:16px 0 0}
.d-body > .btn{margin-top:14px;height:48px;font-size:16px}

/* 狭い画面 */
@media (max-width:1099px){ main{padding:24px 24px 56px} .today,.all-head,.flow,.bar{padding-left:20px;padding-right:20px} .list .c-chk{padding-left:20px} }
@media (max-width:899px){
  .app{display:block}
  .side{position:static;height:auto;display:flex;flex-wrap:wrap;align-items:center;padding:12px 16px}
  .brand{padding:0}
  .menu-btn{display:block;margin-left:auto}
  .side nav{flex:1 0 100%;display:none;padding:10px 0 2px}
  .side nav.open{display:block}
  main{padding:18px 16px 48px}
  .top{flex-direction:column;gap:6px;margin-bottom:16px}
  h1{font-size:26px}
  .who{justify-content:flex-start;margin:0;font-size:13px}
  .today{padding:18px 16px 4px;margin-bottom:20px}
  .today h2{font-size:21px;gap:10px}
  .count{font-size:34px;min-width:50px;padding:4px 10px 6px}
  .task{grid-template-columns:minmax(0,1fr) 16px;gap:2px 10px;padding:13px 0}
  .act{font-size:17px}
  .rsn{grid-column:1;grid-row:auto;text-align:left;order:3}
  .rsn small{display:inline;margin-left:8px}
  .who2{font-size:14px}
  .chev{grid-column:2;grid-row:1/4}
  .all-head{flex-wrap:wrap;padding:0 16px 6px;gap:10px}
  .search{flex:1 0 100%}
  .search input{width:100%}
  .flow{padding:6px 12px 10px;gap:2px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}
  .bar{padding:10px 16px}
  .bar .btn{flex:1 1 auto}
  .tablewrap{overflow:visible}
  table.list{min-width:0}
  .list thead{display:none}
  .list,.list tbody{display:block}
  .list tr.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;grid-template-areas:"chk id amt" "chk who who" "chk state ship";gap:3px 8px;padding:14px 16px 14px 0;border-bottom:1px solid var(--line)}
  .list tbody tr:last-child{border-bottom:0}
  .list tr.row td{display:block;border:0;padding:0;width:auto}
  .list td.c-chk{grid-area:chk;padding:2px 0 0 18px}
  .list td.c-id{grid-area:id;display:flex;gap:10px;align-items:baseline}
  .list td.c-amt{grid-area:amt;text-align:right}
  .list td.c-who{grid-area:who}
  .list td.c-state{grid-area:state;display:flex;flex-wrap:wrap;gap:0 12px;width:auto;margin-top:4px}
  .list td.c-ship{grid-area:ship;text-align:right;margin-top:4px}
  .list td.c-ship .due,.list td.c-ship span{display:inline}
  .list td.c-ship .due::before{content:" · ";color:var(--mute);font-weight:400}
  .d-head .lbl-m{display:inline}.d-head .lbl-d{display:none}
  dialog{width:100%;max-width:none;height:100%;max-height:none;border-radius:0;margin:0}
  .d-head{padding:12px 16px;flex-direction:row-reverse;justify-content:space-between}
  .d-head h2{font-size:19px}
  .d-body{display:block;padding:0 16px 28px}
  .d-total{font-size:26px}
}
</style>
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<div class="app">
  <div class="side">
    <a class="brand" href="#">Parcel</a>
    <button type="button" class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">メニュー</button>
    <nav id="nav" aria-label="メインメニュー">
      <ul>
        <li><a href="#">ホーム</a></li>
        <li><a href="#" aria-current="page">注文</a></li>
        <li><a href="#">商品</a></li>
        <li><a href="#">在庫</a></li>
        <li><a href="#">顧客</a></li>
        <li><a href="#">設定</a></li>
      </ul>
    </nav>
  </div>

  <main id="main">
    <header class="top">
      <h1>注文</h1>
      <p class="who"><span>灯台珈琲</span><span id="today"></span><span>森田 恵</span></p>
    </header>

    <section class="panel today" aria-labelledby="hToday">
      <div class="today-head">
        <h2 id="hToday"><span class="count" id="attnCount"></span><span>件が要対応</span></h2>
        <button type="button" class="btn" id="goReady"></button>
      </div>
      <ol class="tasks" id="tasks"></ol>
    </section>

    <section class="panel all" aria-labelledby="hAll">
      <div class="all-head">
        <h2 class="t2" id="hAll">すべての注文</h2>
        <form class="search" role="search" onsubmit="return false">
          <label class="sr" for="q">注文番号・購入者名・商品名で検索</label>
          <input id="q" type="search" placeholder="注文番号・購入者名・商品名" autocomplete="off">
        </form>
      </div>
      <div class="flow" id="flow" role="group" aria-label="注文状態で絞り込み"></div>
      <div class="bar" id="bar">
        <button type="button" class="btn" id="pickReady"></button>
        <p class="status" id="selText" role="status"></p>
        <button type="button" class="btn btn-primary" id="advance" aria-describedby="selText">発送準備中にする</button>
        <p class="why" id="why" hidden></p>
      </div>
      <div class="tablewrap" id="tablewrap">
        <table class="list">
          <thead>
            <tr>
              <th scope="col" class="c-chk"><input type="checkbox" id="pickAll" aria-label="表示中の注文をすべて選択"></th>
              <th scope="col">注文番号</th><th scope="col">購入者・商品</th><th scope="col" class="num">金額</th>
              <th scope="col">注文状態・支払い</th><th scope="col">配送・発送期限</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>
        <p class="t">条件に合う注文はありません</p>
        <p id="emptyCond"></p>
        <button type="button" class="btn" id="clear">検索と絞り込みを解除</button>
      </div>
    </section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dTitle">
  <div class="d-head">
    <h2 id="dTitle" tabindex="-1"></h2>
    <button type="button" class="btn btn-sm" id="dClose"><span class="lbl-d">閉じる</span><span class="lbl-m">← 一覧に戻る</span></button>
  </div>
  <div class="d-body" id="dBody"></div>
</dialog>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>

  dlg.addEventListener('close', () => { S.detail = null; document.body.style.overflow = ''; });
  $('#dClose').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); }); // 背景を押すと閉じる
  $('#dBody').addEventListener('click', (e) => {
    const b = e.target.closest('[data-advance-one]'); if (!b) return;
    const id = b.dataset.advanceOne;
    if (Core.advanceOne(id)) { renderAll(); renderDetail(); announce(`#${id} を「発送準備中」にしました`); $('#dTitle').focus(); }
  });

  function renderAll() { renderTasks(); renderFlow(); renderRows(); }
  renderAll();
})();
</script>
</body>
</html>
