<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注文 — Parcel(案A Practical)</title>
<style>
:root{
  --bg:#F3F4F6; --panel:#fff; --ink:#18202B; --ink2:#46505E; --mute:#5E6977;
  --line:#E2E6EB; --line2:#C9CFD7; --accent:#B93A0A; --hover:#F6F7F9; --sel:#EAF0F7;
  --header-h:52px;
  --brand:#1F4E8C; --brand-d:#173D70; --brand-tint:#E8EFF8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{top:8px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}

/* ヘッダー */
.top{height:var(--header-h);background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px}
.brand{font-size:18px;font-weight:800;letter-spacing:.02em;color:var(--brand);text-decoration:none}
.who{margin:0 0 0 auto;display:flex;gap:20px;color:var(--ink2);font-size:14px}
.who span:last-child{color:var(--ink);font-weight:600}
.menu-btn{display:none;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);font-weight:600}

/* 全体 */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100vh - var(--header-h))}
nav{background:var(--panel);border-right:1px solid var(--line);padding:12px}
nav ul{list-style:none;margin:0;padding:0}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--ink2);text-decoration:none}
nav a:hover{background:var(--hover);color:var(--ink)}
nav a[aria-current="page"]{background:var(--brand-tint);color:var(--brand);font-weight:700}
main{padding:20px 24px 48px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
h1{margin:0;font-size:22px;line-height:1.3;font-weight:700}
.search input{width:340px;max-width:100%;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:var(--panel)}
.search input::placeholder{color:var(--mute)}

/* 一覧の領域(囲むのはここだけ) */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 12px 10px;margin-bottom:-1px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab .n{margin-left:5px;color:var(--mute)}
.tab[aria-pressed="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--brand)}
.tab[aria-pressed="true"] .n{color:var(--ink)}
.tab.is-attn{font-weight:700}
.tab.is-attn .n{color:var(--accent);font-weight:800;font-size:16px}

.bar{position:sticky;top:0;z-index:5;background:var(--panel);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar .status{margin:0;color:var(--ink2);flex:1 1 auto;min-width:0}
.bar .status b{color:var(--ink)}
.bar .why{flex:1 0 100%;margin:0;color:var(--ink);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.bar .why[hidden]{display:none}
.btn{height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-d)}
.btn-sec{color:var(--brand);border-color:#9DB3D2}
.btn-sec:hover{background:var(--brand-tint)}
.btn:disabled{background:#EDEFF2;border-color:var(--line);color:#737D8A;cursor:not-allowed}
.btn-sm{height:30px;padding:0 10px;font-size:13px}

/* アイコン(インラインSVG)。ナビ・検索・要対応の種類・主ボタンだけに使う */
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav .ic{width:18px;height:18px;color:var(--mute)}
nav a[aria-current="page"] .ic{color:var(--brand)}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:11px;width:16px;height:16px;color:var(--mute);pointer-events:none}
.search input{padding-left:36px}
.todo{display:flex;gap:8px;align-items:flex-start}
.todo .ico{flex:none;width:20px;height:20px;margin-top:1px;display:grid;place-items:center;color:var(--accent)}
.todo .ico .ic{width:18px;height:18px}
.todo .ico.solid{background:var(--accent);color:#fff;border-radius:50%}
.todo .ico.solid .ic{width:13px;height:13px;stroke-width:2.2}
.todo .ico.go{color:var(--brand)}
.todo .ttxt{min-width:0}
.d-attn h3{display:flex;align-items:center;gap:6px}
.d-attn h3 .ic{width:16px;height:16px}

/* 表 */
.tablewrap{overflow-x:auto;container-type:inline-size}
table.list{width:100%;min-width:1040px;border-collapse:collapse}
.list th{padding:8px 10px;text-align:left;font-size:13px;font-weight:600;color:var(--mute);border-bottom:1px solid var(--line2);white-space:nowrap}
.list th.num{text-align:right}
.list td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.list tbody tr.row:hover{background:var(--hover)}
.list tr.is-sel{background:var(--sel)}
.list tr.is-sel:hover{background:var(--sel)}
.list tr[aria-current="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.list .c-chk{width:44px;padding-left:16px;padding-right:0}
.list input[type=checkbox]{width:18px;height:18px;margin:1px 0 0;accent-color:var(--brand)}
.c-id{width:116px;white-space:nowrap}
.c-id .sub{display:block;font-size:13px;color:var(--mute)}
.link{background:none;border:0;padding:0;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--ink)}
.c-buyer{width:112px}
.c-items{color:var(--ink2)}
.c-amt{width:84px;white-space:nowrap}
.c-pay{width:92px;white-space:nowrap}
.c-state{width:116px;white-space:nowrap}
.c-ship{width:72px;white-space:nowrap}
.c-due{width:84px;white-space:nowrap}
.c-due.hot{color:var(--accent);font-weight:700}
.c-todo{width:236px}
.c-todo .why-l{display:block;color:var(--accent);font-weight:700}
.c-todo .act{display:block;color:var(--ink2)}
.c-todo .act.ready{color:var(--brand);font-weight:700}
.pay-err{color:var(--accent);font-weight:700}
.pay-err b{display:none}
.pay-due{font-weight:700}
.pay-muted{color:var(--mute)}
.pie{display:inline-block;width:12px;height:12px;border:1.5px solid currentColor;border-radius:50%;margin-right:6px;vertical-align:-1px}
.pie.s1{background:conic-gradient(currentColor 0 25%,transparent 0)}
.pie.s2{background:conic-gradient(currentColor 0 50%,transparent 0)}
.pie.s3{background:conic-gradient(currentColor 0 75%,transparent 0)}
.pie.s4{background:currentColor}
.pie.sx{background:linear-gradient(135deg,transparent 42%,currentColor 42% 58%,transparent 58%)}
.empty{padding:48px 16px;text-align:center;color:var(--ink2)}
.empty p{margin:0 0 4px}
.empty .t{font-size:16px;font-weight:700;color:var(--ink)}
.empty .btn{margin-top:14px}

@container (max-width:880px){
  table.list{min-width:740px}
  .list .c-items,.list .c-ship,.list .c-pay{display:none}
  .list .c-buyer{width:100px}.list .c-todo{width:200px}
}
/* 詳細(右側のドロワー)。開いている間は、一覧を左に寄せる */
@media (min-width:900px){ body.lock main{margin-right:400px} }
.detail{position:fixed;top:var(--header-h);right:0;bottom:0;width:400px;max-width:100%;background:var(--panel);border-left:1px solid var(--line2);overflow-y:auto;z-index:30}
.detail[hidden]{display:none}
.detail:focus{outline:none}
.d-head{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);z-index:2}
.d-head h2{margin:0;font-size:18px;line-height:1.35;font-weight:700;flex:1;min-width:0}
.d-head h2:focus{outline:none}
.d-head .lbl-m{display:none}
.d-body{padding:4px 20px 28px}
.d-body section{padding:16px 0;border-bottom:1px solid var(--line)}
.d-body section:last-of-type{border-bottom:0}
.d-body h3{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink2)}
.d-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.d-state{margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-weight:600}
.d-total{margin:0;font-size:22px;font-weight:700}
.d-attn h3{color:var(--accent);font-size:14px}
.d-attn ul{list-style:none;margin:0;padding:0}
.d-attn li{margin:0 0 6px}
.d-attn b{display:block;color:var(--accent)}
.d-attn span{color:var(--ink2)}
.d-lines{width:100%;border-collapse:collapse}
.d-lines th,.d-lines td{padding:6px 0;text-align:left;font-weight:400;font-size:14px}
.d-lines thead th{font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.d-lines th.num,.d-lines td.num{text-align:right;padding-left:10px}
.d-lines tfoot tr:first-child th,.d-lines tfoot tr:first-child td{padding-top:10px}
.d-lines tfoot th{color:var(--ink2)}
.d-lines tr.sum th,.d-lines tr.sum td{font-weight:700;color:var(--ink);border-top:1px solid var(--line)}
.d-info{margin:0;display:grid;gap:6px}
.d-info div{display:grid;grid-template-columns:84px 1fr;gap:8px}
.d-info dt{color:var(--mute)}
.d-info dd{margin:0}
.d-note{margin:0}
.d-next{margin:12px 0 0}
.d-body .btn{margin-top:12px;width:100%}

/* 狭い画面 */
@media (max-width:899px){
  :root{--header-h:auto}
  .top{flex-wrap:wrap;gap:2px 12px;padding:8px 16px 8px;height:auto;min-height:56px}
  .menu-btn{display:block;order:2;margin-left:auto}
  .who{order:3;flex:1 0 100%;margin:0;gap:6px 12px;flex-wrap:wrap;font-size:13px}
  .shell{display:block}
  nav{display:none;border-right:0;border-bottom:1px solid var(--line)}
  nav.open{display:block}
  main{padding:14px 16px 40px}
  .head{flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .search{flex:1 0 100%}
  .search input{width:100%}
  .detail{inset:0;width:auto;border-left:0;z-index:50}
  .d-head .lbl-m{display:inline}.d-head .lbl-d{display:none}
  body.lock{overflow:hidden}
  .bar{padding:10px 12px}
  .bar .btn{flex:1 1 auto}
  /* 表を、1件ずつのブロックに組み替える */
  .tablewrap{overflow:visible}
  table.list{min-width:0}
  .list thead{display:none}
  .list,.list tbody{display:block}
  .list .c-items,.list .c-ship,.list .c-pay{display:block}
  .list tr.row{display:grid;grid-template-columns:44px auto auto 1fr;grid-template-areas:"chk id id amt" "chk buyer buyer state" "chk items items items" "chk todo todo todo" "chk pay ship due";gap:2px 8px;padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}
  .list tr.row td{display:block;border:0;padding:0;width:auto}
  .list td.c-chk{grid-area:chk;padding:2px 0 0 14px}
  .list td.c-id{grid-area:id;display:flex;gap:10px;align-items:baseline}
  .list td.c-amt{grid-area:amt;text-align:right}
  .list td.c-buyer{grid-area:buyer;font-weight:600}
  .list td.c-state{grid-area:state;text-align:right}
  .list td.c-items{grid-area:items}
  .list td.c-todo{grid-area:todo;margin-top:2px}
  .list td.c-todo:empty{display:none}
  .list td.c-pay{grid-area:pay}
  .list td.c-ship{grid-area:ship}
  .list td.c-due{grid-area:due;text-align:right}
  .list td.c-due::before{content:"発送期限 ";color:var(--mute);font-weight:400}
  .list td.c-due.hot::before{color:var(--accent)}
  .list tr.is-sel{background:var(--sel)}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-orders" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/></symbol>
  <symbol id="i-products" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/></symbol>
  <symbol id="i-stock" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8"/><path d="M18 14.3c2 .8 3.5 2.6 3.5 5.7"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><path d="M12 17.3v.2"/></symbol>
  <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8z"/><circle cx="6.5" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></symbol>
  <symbol id="i-cardx" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/><path d="M15.5 13.5l3 3m0-3l-3 3"/></symbol>
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 7.5L12 12l3.5-4.5M12 12v5M9 13.5h6M9 15.5h6"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
</svg>
<a class="skip" href="#main">本文へ移動</a>
<header class="top">
  <a class="brand" href="#">Parcel</a>
  <button type="button" class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">メニュー</button>
  <p class="who"><span>灯台珈琲</span><span id="today"></span><span>森田 恵</span></p>
</header>

<div class="shell">
  <nav id="nav" aria-label="メインメニュー">
    <ul>
      <li><a href="#"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg>ホーム</a></li>
      <li><a href="#" aria-current="page"><svg class="ic" aria-hidden="true"><use href="#i-orders"/></svg>注文</a></li>
      <li><a href="#"><svg class="ic" aria-hidden="true"><use href="#i-products"/></svg>商品</a></li>
      <li><a href="#"><svg class="ic" aria-hidden="true"><use href="#i-stock"/></svg>在庫</a></li>
      <li><a href="#"><svg class="ic" aria-hidden="true"><use href="#i-users"/></svg>顧客</a></li>
      <li><a href="#"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg>設定</a></li>
    </ul>
  </nav>

  <main id="main">
    <div class="head">
      <h1>注文</h1>
      <form class="search" role="search" onsubmit="return false">
        <label class="sr" for="q">注文番号・購入者名・商品名で検索</label>
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="注文番号・購入者名・商品名" autocomplete="off">
      </form>
    </div>

    <section class="panel" aria-label="注文一覧">
      <div class="tabs" id="tabs" role="group" aria-label="注文状態で絞り込み"></div>
      <div class="bar" id="bar">
        <button type="button" class="btn btn-sec" id="pickReady"></button>
        <p class="status" id="selText" role="status"></p>
        <button type="button" class="btn btn-primary" id="advance" aria-describedby="selText"><svg class="ic" aria-hidden="true"><use href="#i-orders"/></svg>発送準備中にする</button>
        <p class="why" id="why" hidden></p>
      </div>
      <div class="tablewrap" id="tablewrap">
        <table class="list">
          <thead>
            <tr>
              <th scope="col" class="c-chk"><input type="checkbox" id="pickAll" aria-label="表示中の注文をすべて選択"></th>
              <th scope="col" class="c-id">注文番号</th><th scope="col" class="c-buyer">購入者</th><th scope="col" class="c-items">商品</th>
              <th scope="col" class="num c-amt">金額</th><th scope="col" class="c-pay">支払い</th><th scope="col" class="c-state">注文状態</th>
              <th scope="col" class="c-ship">配送</th><th scope="col" class="c-due">発送期限</th><th scope="col" class="c-todo">対応</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>
        <p class="t">条件に合う注文はありません</p>
        <p id="emptyCond"></p>
        <button type="button" class="btn" id="clear">検索と絞り込みを解除</button>
      </div>
    </section>
  </main>
</div>

<aside class="detail" id="detail" aria-label="注文の詳細" hidden>
  <div class="d-head">
    <h2 id="dTitle" tabindex="-1"></h2>
    <button type="button" class="btn btn-sm" id="dClose"><span class="lbl-d">閉じる</span><span class="lbl-m">← 一覧に戻る</span></button>
  </div>
  <div class="d-body" id="dBody"></div>
</aside>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>
/* ===== 共通データと業務ロジック(全案で同一) ===== */
const Core = (() => {
  const TODAY = { y: 2026, m: 10, d: 16, num: 1016, label: '2026年10月16日(金)', time: '10:30' };
  const PRICE = {
    '深煎りブレンド 200g': 1480, '浅煎りブレンド 200g': 1480, 'エチオピア 200g': 1780,
    'カフェインレス 200g': 1600, 'ドリップバッグ 10個入': 1620, 'ギフトセット(豆2種)': 4800,
  };
  const STATES = ['新規', '確認済み', '発送準備中', '発送済み', '配達完了', 'キャンセル'];
  // 並び: 新しい順
  const RAW = [
    ['10248', '10/16 09:52', '山本 葵', '東京都 世田谷区', [['深煎りブレンド 200g', 2]], 3560, 'クレジットカード', '入金済み', '新規', '宅配便', null, '10/18', ''],

    $('#selText').innerHTML = n ? `<b>${n}件</b>を選択中` : '注文が選ばれていません';
    adv.disabled = n === 0 || ng.length > 0;
    adv.innerHTML = ICON('i-orders') + (ok.length && !ng.length ? `発送準備中にする(${ok.length}件)` : '発送準備中にする');
    if (ng.length) {
      why.hidden = false;
      why.innerHTML = `<span>発送準備に進めない注文が含まれています: ${ng.map((o) => `<b>#${o.id}</b> ${esc(Core.whyNot(o))}`).join('、')}</span><button type="button" class="btn btn-sm" id="dropNg">進めない注文の選択を外す</button>`;
    } else why.hidden = true;
  }
  $('#bar').addEventListener('click', (e) => {
    if (e.target.id === 'dropNg') { Core.selInfo().ng.forEach((o) => S.sel.delete(o.id)); renderRows(); $('#advance').focus(); }
  });
  $('#pickReady').addEventListener('click', () => {
    if (S.filter !== 'all' && S.filter !== 'confirmed') S.filter = 'all';
    if (S.q) { S.q = ''; $('#q').value = ''; }
    ready().forEach((o) => S.sel.add(o.id));
    renderAll();
    announce(`${ready().length}件を選択しました`);
  });
  $('#advance').addEventListener('click', () => {
    const n = Core.advance(); if (!n) return;
    renderAll(); if (S.detail) renderDetail();
    announce(`${n}件を「発送準備中」にしました`);
  });

  /* 詳細 */
  let lastTrigger = null;
  function renderDetail() {
    const o = Core.byId(S.detail); if (!o) return;
    $('#dTitle').textContent = `#${o.id} ${o.buyer}`;
    $('#dBody').innerHTML = Core.detailHTML(o);
    const h = $('#dBody .d-attn h3'); if (h) h.insertAdjacentHTML('afterbegin', ICON('i-alert'));
  }
  function openDetail(id, fromRow) {
    lastTrigger = document.querySelector(`[data-open="${id}"]`);
    S.detail = id; renderDetail(); renderRows();
    $('#detail').hidden = false; document.body.classList.add('lock');
    $('#dTitle').focus();
  }
  function closeDetail() {
    const id = S.detail; S.detail = null; $('#detail').hidden = true; document.body.classList.remove('lock');
    renderRows();
    (document.querySelector(`[data-open="${id}"]`) || $('#q')).focus();
  }
  $('#dClose').addEventListener('click', closeDetail);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.detail) closeDetail(); });
  $('#dBody').addEventListener('click', (e) => {
    const b = e.target.closest('[data-advance-one]'); if (!b) return;
    const id = b.dataset.advanceOne;
    if (Core.advanceOne(id)) { renderAll(); renderDetail(); announce(`#${id} を「発送準備中」にしました`); $('#dTitle').focus(); }
  });

  function renderAll() { renderTabs(); renderRows(); }
  renderAll();
})();
</script>
</body>
</html>
