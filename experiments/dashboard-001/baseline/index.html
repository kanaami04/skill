<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダッシュボード | Northstar</title>
<style>
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --border: #d6d9de;
  --text: #16202e;
  --text-sub: #4b5565;
  --accent: #2a4fb8;
  --side-bg: #14213d;
  --side-text: #c9d3e6;
  --danger: #b42318;
  --warn: #8a3b0a;
  --ok: #05603a;
  --hold: #475467;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
}
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 8px; top: -48px; z-index: 100;
  background: #fff; padding: 8px 12px; border-radius: 4px; border: 2px solid var(--accent);
}
.skip-link:focus { top: 8px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  background: var(--side-bg);
  color: var(--side-text);
  padding: 20px 12px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; color: #fff; font-weight: 700; font-size: 18px; letter-spacing: .02em; }
.brand-mark { color: #8fb0ff; font-size: 20px; line-height: 1; }
.nav-list { display: grid; gap: 2px; }
.nav-link {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 10px; border-radius: 4px;
  color: var(--side-text); text-decoration: none; font-size: 14px;
}
.nav-link svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-link:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav-link[aria-current="page"] { background: #fff; color: var(--side-bg); font-weight: 700; }
.nav-link .nav-count { margin-left: auto; min-width: 22px; text-align: center; font-size: 12px; font-weight: 700; }
.sidebar :focus-visible { outline-color: #fff; }
.sidebar .nav-link[aria-current="page"]:focus-visible { outline-color: #8fb0ff; }

.main { min-width: 0; }
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 12px 32px; background: var(--surface); border-bottom: 1px solid var(--border);
  min-height: 56px;
}
.menu-btn {
  display: none; align-items: center; justify-content: center;
  width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer;
}
.menu-btn svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; }
.topbar-brand { display: none; font-weight: 700; font-size: 16px; }
.topbar-brand span { color: var(--accent); }
.workspace { color: var(--text-sub); font-size: 13px; }
.workspace strong { color: var(--text); font-size: 14px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.today-date { font-size: 13px; color: var(--text-sub); white-space: nowrap; }
.today-date .short { display: none; }
.user { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--side-bg); color: #fff;
  display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none;
}
.user-name { font-size: 13px; line-height: 1.3; white-space: nowrap; }
.user-name small { display: block; color: var(--text-sub); font-size: 11px; }

.content { padding: 28px 32px 56px; max-width: 1280px; }
.page-head { margin-bottom: 28px; }
.page-head h1 { font-size: 22px; line-height: 1.3; }
.summary { margin-top: 4px; color: var(--text-sub); font-size: 14px; }
.summary b { color: var(--text); font-size: 15px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; align-items: start; }
.col { display: grid; gap: 36px; min-width: 0; }

/* ---------- sections (枠なし。見出しと余白で区切る) ---------- */
.panel-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 0 0 8px; border-bottom: 1px solid var(--border); }
.panel-head h2 { font-size: 16px; line-height: 1.4; }
.panel-head .sub { color: var(--text-sub); font-size: 12px; }
.count-pill { font-size: 14px; font-weight: 700; color: var(--text); }
.count-pill.alert { color: var(--danger); }
#h-today { font-size: 20px; }
#today-count { font-size: 20px; color: var(--danger); }
#today-count.zero { color: var(--ok); }

/* ---------- badges / tags ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600; line-height: 1.6; white-space: nowrap; color: var(--hold);
}
.badge .g { font-size: 11px; line-height: 1; }
/* 塗りつぶしにするのは「遅延・ブロック」「要注意」だけ。それ以外は文字と記号のみ */
.st-遅延, .st-ブロック { background: var(--danger); color: #fff; padding: 1px 8px; border-radius: 3px; }
.st-要注意 { background: var(--warn); color: #fff; padding: 1px 8px; border-radius: 3px; }
.st-順調, .st-完了 { color: var(--ok); }
.st-保留, .st-未着手 { color: var(--hold); }
.st-進行中 { color: var(--accent); }
.st-レビュー待ち { color: #5b3aa0; }

.pri { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-sub); white-space: nowrap; }
.pri .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.pri .bars i { width: 3px; border-radius: 1px; background: #c3cad5; }
.pri .bars i:nth-child(1) { height: 5px; }
.pri .bars i:nth-child(2) { height: 8px; }
.pri .bars i:nth-child(3) { height: 12px; }
.pri-高 { color: var(--text); font-weight: 700; }
.pri-高 .bars i { background: var(--danger); }
.pri-中 .bars i:nth-child(-n+2) { background: var(--text-sub); }
.pri-低 .bars i:nth-child(1) { background: var(--text-sub); }

.tag { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 12px; font-weight: 700; line-height: 1.6; white-space: nowrap; }
.tag-over { background: var(--danger); color: #fff; }
.tag-today { border: 1.5px solid var(--text); color: var(--text); padding: 0 7px; }
.new-note { font-size: 12px; font-weight: 700; color: var(--accent); }

/* ---------- tasks ---------- */
.task-list { display: grid; }
.task {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: start;
  padding: 12px 0; border-top: 1px solid var(--border);
}
.task:first-child { border-top: 0; }
.task.is-done .task-title { text-decoration: line-through; color: var(--text-sub); font-weight: 400; }
.task-check { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: -10px 0 -10px -12px; cursor: pointer; }
.task-check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.task-title { font-weight: 600; font-size: 14px; line-height: 1.5; }
.task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 4px; font-size: 12px; color: var(--text-sub); }
.task-due { text-align: right; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--text-sub); padding-top: 1px; }
.task-due small { display: block; font-weight: 400; color: var(--text-sub); font-size: 12px; margin-top: 2px; }
.task-note { color: var(--text-sub); }

/* 最優先の1件だけ大きくする */
.task.top { padding: 16px 0; }
.task.top .task-title { font-size: 18px; font-weight: 700; line-height: 1.45; }
.task.top .task-meta { margin-top: 6px; font-size: 13px; }
.top-label { display: block; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }

.empty { display: flex; gap: 14px; align-items: center; padding: 20px 0; }
.empty .tick { width: 36px; height: 36px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 18px; flex: none; }
.empty strong { display: block; font-size: 16px; color: var(--ok); }
.empty span { font-size: 13px; color: var(--text-sub); }
.none { padding: 12px 0; color: var(--text-sub); font-size: 13px; }

/* ---------- attention projects ---------- */
.attn-list { display: grid; }
.attn { padding: 14px 0; border-top: 1px solid var(--border); }
.attn:first-child { border-top: 0; }
.attn-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.attn-top h3 { font-size: 15px; }
.attn-memo { margin-top: 6px; font-size: 14px; }
.attn-facts { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 12px; color: var(--text-sub); }
.attn-facts b { color: var(--text); font-weight: 600; }

/* ---------- projects table ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0; }
.filter-btn {
  min-height: 36px; padding: 4px 12px; border: 1px solid var(--border); border-radius: 4px;
  background: #fff; cursor: pointer; font-size: 13px;
}
.filter-btn:hover { border-color: var(--text-sub); }
.filter-btn[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; font-weight: 700; }
.filter-btn .n { margin-left: 4px; opacity: .85; font-size: 12px; }
.table-wrap { overflow-x: auto; }
table.projects { width: 100%; border-collapse: collapse; }
.projects th {
  text-align: left; font-size: 12px; font-weight: 600; color: var(--text-sub);
  padding: 8px 12px; border-bottom: 1px solid var(--text-sub); white-space: nowrap;
}
.projects th:first-child, .projects td:first-child { padding-left: 0; }
.projects th:last-child, .projects td:last-child { padding-right: 0; }
.projects td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.projects tr:last-child td { border-bottom: 0; }
.p-name { font-weight: 600; }
.p-memo { margin-top: 2px; font-size: 12px; color: var(--text-sub); font-weight: 400; }
.progress { display: flex; align-items: center; gap: 8px; min-width: 130px; }
.bar { flex: 1; height: 8px; background: #d3d8df; border-radius: 2px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.bar.s-遅延 > span { background: var(--danger); }
.bar.s-要注意 > span { background: var(--warn); }
.bar.s-保留 > span { background: #5b6b82; }
.bar.s-完了 > span { background: var(--ok); }
.progress .pct { font-size: 13px; font-weight: 700; min-width: 38px; text-align: right; }
.progress-sub { font-size: 11px; color: var(--text-sub); }
.nowrap { white-space: nowrap; }

/* ---------- activity ---------- */
.act-group h3 { font-size: 12px; font-weight: 700; color: var(--text-sub); padding: 12px 0 2px; display: flex; gap: 8px; align-items: baseline; }
.act-item { padding: 8px 0; border-top: 1px solid var(--border); }
.act-item:first-of-type { border-top: 0; }
.act-meta { font-size: 12px; color: var(--text-sub); display: flex; flex-wrap: wrap; gap: 0 8px; }
.act-meta b { color: var(--text); font-weight: 600; }
.act-body { font-size: 13px; margin-top: 1px; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 36px; }
}
@media (max-width: 900px) {
  .shell { display: block; }
  .sidebar {
    display: none; position: fixed; z-index: 50; left: 0; right: 0; top: 56px; height: auto; max-height: calc(100vh - 56px);
    box-shadow: 0 12px 24px rgba(0,0,0,.25);
  }
  .sidebar.open { display: block; }
  .sidebar .brand { display: none; }
  .topbar { padding: 6px 12px; position: sticky; top: 0; z-index: 60; gap: 10px; }
  .menu-btn { display: inline-flex; }
  .topbar-brand { display: block; }
  .workspace { display: none; }
  .today-date .full { display: none; }
  .today-date .short { display: inline; }
  .topbar-right { gap: 10px; }
  .user-name small { display: none; }
  .content { padding: 16px 16px 40px; }
  .page-head { margin-bottom: 16px; }
  .page-head h1 { font-size: 19px; }
  .col { gap: 28px; }
  .layout { gap: 28px; }
  #h-today, #today-count { font-size: 18px; }
  .task.top .task-title { font-size: 16px; }

  .table-wrap { overflow: visible; }
  .projects thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  .projects, .projects tbody { display: block; }
  .projects tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .projects tr:first-child { border-top: 0; }
  .projects td { display: block; padding: 0 !important; border: 0; }
  .projects td[data-label]::before { content: attr(data-label); display: block; font-size: 11px; color: var(--text-sub); }
  .projects td.c-name { grid-column: 1 / -1; }
  .projects td.c-prog { grid-column: 1 / -1; }
}
@media (max-width: 420px) {
  .task { grid-template-columns: auto minmax(0, 1fr); }
  .task-due { grid-column: 2; text-align: left; padding-top: 0; }
  .task-due small { display: inline; margin-left: 6px; }
  .user-name { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  var TASKS = [
    { id: 'T-101', title: 'ヘルプ記事の移行範囲を確定する', project: 'P3', priority: '高', status: '進行中', due: '2026-10-13', note: '' },
    { id: 'T-102', title: 'ログイン画面デザインのレビュー', project: 'P1', priority: '高', status: 'レビュー待ち', due: '2026-10-14', note: '田中 美咲から依頼' },
    { id: 'T-103', title: '決済APIの仕様差分を確認する', project: 'P1', priority: '高', status: 'ブロック', due: '2026-10-15', note: 'ベンダーの回答待ち' },
    { id: 'T-104', title: '移行スケジュールの再調整をクライアントに連絡', project: 'P3', priority: '高', status: '未着手', due: '2026-10-15', note: '' },
    { id: 'T-105', title: '請求書テンプレートの最終承認', project: 'P2', priority: '中', status: 'レビュー待ち', due: '2026-10-15', note: '鈴木 健から依頼' },
    { id: 'T-106', title: 'LPのコピー案にフィードバックする', project: 'P4', priority: '中', status: '未着手', due: '2026-10-16', note: '' },
    { id: 'T-107', title: '週次定例のアジェンダを作成する', project: null, priority: '低', status: '未着手', due: '2026-10-16', note: 'チーム運営' },
    { id: 'T-108', title: 'データ基盤移行の再開可否を判断する', project: 'P5', priority: '中', status: '未着手', due: '2026-10-17', note: '' },
    { id: 'T-109', title: 'QA環境の負荷試験結果を確認する', project: 'P1', priority: '中', status: '未着手', due: '2026-10-19', note: '' },
    { id: 'T-110', title: '新メンバーのアカウント権限を設定する', project: null, priority: '低', status: '完了', due: '2026-10-15', note: '', doneNote: '今日 09:05 に完了' }
  ];

  var ACTIVITIES = [
    { date: '10/15', time: '10:12', who: '鈴木 健', text: '「請求書テンプレートの最終承認」のレビューを依頼', project: 'P2' },
    { date: '10/15', time: '09:30', who: '田中 美咲', text: '「決済APIの仕様差分を確認する」をブロックに変更(ベンダーの回答待ち)', project: 'P1' },
    { date: '10/15', time: '09:05', who: '佐藤 遥', text: '「新メンバーのアカウント権限を設定する」を完了', project: null },
    { date: '10/14', time: '18:20', who: '高橋 涼', text: 'コメント:「記事数が想定の1.5倍あり、10/20は厳しいです」', project: 'P3' },
    { date: '10/14', time: '16:45', who: '田中 美咲', text: '「ログイン画面デザインのレビュー」のレビューを依頼', project: 'P1' },
    { date: '10/14', time: '11:00', who: '伊藤 さくら', text: '「コピー案 v2」を添付', project: 'P4' },
    { date: '10/13', time: '17:30', who: '鈴木 健', text: '「CSV出力」を完了', project: 'P2' },
    { date: '10/13', time: '10:15', who: '佐藤 遥', text: 'プロジェクトを保留に変更(予算確定待ち)', project: 'P5' }
  ];
  var ACT_LABEL = { '10/15': '今日 10/15(木)', '10/14': '昨日 10/14(水)', '10/13': '10/13(火)' };

  var STATUS_GLYPH = {
    '遅延': '▲', '要注意': '◆', '順調': '●', '保留': 'Ⅱ', '完了': '✓',
    '未着手': '○', '進行中': '◔', 'レビュー待ち': '◑', 'ブロック': '■'
  };

  // 初期状態の整理
  TASKS.forEach(function (t) {
    t.done = t.status === '完了';
    t.base = t.done ? '未着手' : t.status;
  });

  var filter = 'all';
  var FILTERS = [
    { key: 'all', label: 'すべて', test: function () { return true; } },
    { key: 'attn', label: '要対応(遅延・要注意)', test: function (p) { return p.status === '遅延' || p.status === '要注意'; } },
    { key: 'ok', label: '順調', test: function (p) { return p.status === '順調'; } },
    { key: 'hold', label: '保留', test: function (p) { return p.status === '保留'; } },
    { key: 'done', label: '完了', test: function (p) { return p.status === '完了'; } }
  ];

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toUTC(iso) {
    var p = iso.split('-').map(Number);
    return Date.UTC(p[0], p[1] - 1, p[2]);
  }
  function diffDays(iso) { return Math.round((toUTC(iso) - toUTC(TODAY)) / 86400000); }
  function fmtDate(iso) {
    var p = iso.split('-').map(Number);
    return p[1] + '/' + p[2] + '(' + WEEK[new Date(toUTC(iso)).getUTCDay()] + ')';
  }
  function projectName(id) {
    if (!id) return null;
    for (var i = 0; i < PROJECTS.length; i++) if (PROJECTS[i].id === id) return PROJECTS[i].name;
    return null;
  }
  function taskStatus(t) { return t.done ? '完了' : t.base; }
  function isToday(t) { return !t.done && (diffDays(t.due) <= 0 || t.base === 'ブロック'); }
  function isUpcoming(t) { var d = diffDays(t.due); return !t.done && !isToday(t) && d >= 1 && d <= 7; }
  var PRI_RANK = { '高': 0, '中': 1, '低': 2 };

  function statusBadge(s) {
    return '<span class="badge st-' + s + '"><span class="g" aria-hidden="true">' + STATUS_GLYPH[s] + '</span>' + esc(s) + '</span>';
  }
  function priBadge(p) {
    return '<span class="pri pri-' + p + '"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>優先度:' + p + '</span>';
  }

  /* ---------- tasks ---------- */
  function dueHtml(t) {
    var d = diffDays(t.due);
    if (t.done) return '<div class="task-due">' + fmtDate(t.due) + '</div>';
    if (d < 0) return '<div class="task-due"><span class="tag tag-over">期限切れ</span><small>' + fmtDate(t.due) + '・' + (-d) + '日超過</small></div>';
    if (d === 0) return '<div class="task-due"><span class="tag tag-today">今日が期限</span><small>' + fmtDate(t.due) + '</small></div>';
    return '<div class="task-due">' + fmtDate(t.due) + '<small>あと' + d + '日</small></div>';
  }

  function taskHtml(t, opts) {
    opts = opts || {};
    var d = diffDays(t.due);
    var cls = 'task';
    if (t.done) cls += ' is-done';
    if (opts.top) cls += ' top';
    var pn = projectName(t.project);
    var note = t.done ? (t.doneNote || '') : t.note;
    var meta = '';
    meta += '<span>' + (pn ? esc(pn) : 'プロジェクトなし') + '</span>';
    meta += priBadge(t.priority);
    meta += statusBadge(taskStatus(t));
    if (note) meta += '<span class="task-note">' + esc(note) + '</span>';
    var top = opts.top ? '<span class="top-label">最優先</span>' : '';
    return '<li class="' + cls + '" data-id="' + t.id + '">' +
      '<label class="task-check"><input type="checkbox" data-id="' + t.id + '"' + (t.done ? ' checked' : '') +
      ' aria-label="' + esc(t.title) + 'を完了にする"></label>' +
      '<div><div class="task-title">' + top + esc(t.title) + '</div><div class="task-meta">' + meta + '</div></div>' +
      dueHtml(t) + '</li>';
  }

  function renderTasks() {
    var today = TASKS.filter(isToday).sort(function (a, b) {
      return (toUTC(a.due) - toUTC(b.due)) || (PRI_RANK[a.priority] - PRI_RANK[b.priority]);
    });
    var up = TASKS.filter(isUpcoming).sort(function (a, b) {
      return (toUTC(a.due) - toUTC(b.due)) || (PRI_RANK[a.priority] - PRI_RANK[b.priority]);
    });
    var done = TASKS.filter(function (t) { return t.done; });
    var open = TASKS.length - done.length;

    var tb = $('today-body');
    if (today.length === 0) {
      tb.innerHTML = '<div class="empty"><div class="tick" aria-hidden="true">✓</div><div><strong>今日の対応はすべて完了</strong><span>期限切れ・今日期限・ブロック中のタスクはありません。</span></div></div>';
    } else {
      tb.innerHTML = '<ul class="task-list">' + today.map(function (t, i) {
        return taskHtml(t, { urgent: true, top: i === 0 });
      }).join('') + '</ul>';
    }
    $('today-count').textContent = today.length + '件';
    $('today-count').classList.toggle('zero', today.length === 0);

    $('up-body').innerHTML = up.length
      ? '<ul class="task-list">' + up.map(function (t) { return taskHtml(t); }).join('') + '</ul>'
      : '<p class="none">今後7日以内に期限が来るタスクはありません。</p>';
    $('up-count').textContent = up.length + '件';

    $('done-body').innerHTML = done.length
      ? '<ul class="task-list">' + done.map(function (t) { return taskHtml(t); }).join('') + '</ul>'
      : '<p class="none">完了したタスクはまだありません。</p>';
    $('done-count').textContent = done.length + '件';

    $('nav-task-count').textContent = open;
    var attn = PROJECTS.filter(FILTERS[1].test).length;
    $('summary').innerHTML = '今日対応するタスクは <b>' + today.length + '件</b>、注意が必要なプロジェクトは <b>' + attn + '件</b>です。' +
      '(自分のタスク 未完了 ' + open + '件 / 完了 ' + done.length + '件)';
    return today.length;
  }

  /* ---------- projects ---------- */
  function dueText(p) {
    if (!p.due) return '未定';
    if (p.status === '完了') return fmtDate(p.due) + ' 完了';
    return fmtDate(p.due);
  }
  function projectRow(p) {
    var pct = Math.round(p.done / p.total * 100);
    var memo = p.memo ? '<div class="p-memo">' + esc(p.memo) + '</div>' : '';
    return '<tr>' +
      '<td class="c-name"><div class="p-name">' + esc(p.name) + '</div>' + memo + '</td>' +
      '<td data-label="状態">' + statusBadge(p.status) + '</td>' +
      '<td class="c-prog" data-label="進捗"><div class="progress"><div class="bar s-' + p.status + '" role="img" aria-label="進捗 ' + pct + '%"><span style="width:' + pct + '%"></span></div><span class="pct">' + pct + '%</span></div>' +
      '<div class="progress-sub">' + p.done + ' / ' + p.total + ' タスク完了</div></td>' +
      '<td class="nowrap" data-label="期限">' + dueText(p) + '</td>' +
      '<td class="nowrap" data-label="担当">' + esc(p.owner) + '</td>' +
      '</tr>';
  }
  function renderFilters() {
    $('filters').innerHTML = FILTERS.map(function (f) {
      var n = PROJECTS.filter(f.test).length;
      return '<button type="button" class="filter-btn" data-key="' + f.key + '" aria-pressed="' + (filter === f.key) + '">' +
        esc(f.label) + '<span class="n">' + n + '</span></button>';
    }).join('');
  }
  function renderProjects() {
    var f = FILTERS.filter(function (x) { return x.key === filter; })[0];
    var list = PROJECTS.filter(f.test);
    $('proj-body').innerHTML = list.map(projectRow).join('');
    $('proj-shown').textContent = list.length + '件を表示(全' + PROJECTS.length + '件)';
  }
  function renderAttention() {
    var rank = { '遅延': 0, '要注意': 1 };
    var list = PROJECTS.filter(FILTERS[1].test).sort(function (a, b) { return rank[a.status] - rank[b.status]; });
    $('attn-count').textContent = list.length + '件';
    $('attn-list').innerHTML = list.map(function (p) {
      var pct = Math.round(p.done / p.total * 100);
      var d = diffDays(p.due);
      return '<article class="attn st-b-' + p.status + '">' +
        '<div class="attn-top">' + statusBadge(p.status) + '<h3>' + esc(p.name) + '</h3></div>' +
        '<p class="attn-memo">' + esc(p.memo) + '</p>' +
        '<div class="attn-facts"><span>期限 <b>' + fmtDate(p.due) + '</b>(あと' + d + '日)</span><span>進捗 <b>' + pct + '%</b></span><span>担当 <b>' + esc(p.owner) + '</b></span></div>' +
        '</article>';
    }).join('');
  }

  /* ---------- activity ---------- */
  function renderActivity() {
    var html = '';
    var last = null;
    ACTIVITIES.forEach(function (a) {
      if (a.date !== last) {
        if (last !== null) html += '</div>';
        var n = ACTIVITIES.filter(function (x) { return x.date === a.date; }).length;
        html += '<div class="act-group"><h3>' + ACT_LABEL[a.date] +
          (a.date === '10/15' ? '<span class="new-note">新着 ' + n + '件</span>' : '') + '</h3>';
        last = a.date;
      }
      var pn = projectName(a.project);
      html += '<div class="act-item"><div class="act-meta"><span>' + a.time + '</span><b>' + esc(a.who) + '</b>' +
        (pn ? '<span>' + esc(pn) + '</span>' : '') + '</div><div class="act-body">' + esc(a.text) + '</div></div>';
    });
    html += '</div>';
    $('act-body').innerHTML = html;
  }

  /* ---------- events ---------- */
  function announce(msg) {
    var el = $('announce');
    el.textContent = '';
    setTimeout(function () { el.textContent = msg; }, 30);
  }

  document.addEventListener('change', function (e) {
    var cb = e.target;
    if (!cb.matches || !cb.matches('.task-check input')) return;
    var id = cb.getAttribute('data-id');
    var t = TASKS.filter(function (x) { return x.id === id; })[0];
    t.done = cb.checked;
    var remain = renderTasks();
    var again = document.querySelector('.task-check input[data-id="' + id + '"]');
    if (again) again.focus();
    announce(t.title + 'を' + (t.done ? '完了にしました' : '未完了に戻しました') + '。今日対応するタスクは' + remain + '件です。');
  });

  $('filters').addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    filter = btn.getAttribute('data-key');
    renderFilters();
    renderProjects();
    var again = document.querySelector('.filter-btn[data-key="' + filter + '"]');
    if (again) again.focus();
    announce($('proj-shown').textContent);
  });

  var sidebar = $('sidebar');
  var menuBtn = $('menu-btn');
  function setMenu(open) {
    sidebar.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    menuBtn.setAttribute('aria-label', open ? 'メニューを閉じる' : 'メニューを開く');
  }
  menuBtn.addEventListener('click', function () { setMenu(!sidebar.classList.contains('open')); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sidebar.classList.contains('open')) { setMenu(false); menuBtn.focus(); }
  });
  sidebar.addEventListener('click', function (e) {
    if (e.target.closest('a')) setMenu(false);
  });
  window.addEventListener('resize', function () {
    if (window.innerWidth > 900) setMenu(false);
  });

  /* ---------- init ---------- */
  renderTasks();
  renderAttention();
  renderFilters();
  renderProjects();
  renderActivity();
})();
</script>
</body>
</html>
