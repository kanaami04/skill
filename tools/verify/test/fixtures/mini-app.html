<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini-app</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  .app { display: flex; }
  #sidenav { width: 200px; background: #eee; padding: 12px; }
  .menu-btn { display: none; position: relative; z-index: 10; }
  main { flex: 1; padding: 12px; }
  .hidden { display: none; }
  @media (max-width: 700px) {
    .app { display: block; }
    #sidenav { position: fixed; top: 0; left: 0; bottom: 0; transform: translateX(-100%); transition: transform .15s; z-index: 5; }
    #sidenav.open { transform: none; }
    .menu-btn { display: inline-block; }
  }
</style></head>
<body>
<div class="app">
  <nav id="sidenav" aria-label="メイン"><a href="#">ダッシュボード</a></nav>
  <div>
    <button class="menu-btn" id="navToggle" type="button" aria-expanded="false" aria-controls="sidenav" aria-label="メニュー">☰</button>
    <main>
      <section aria-labelledby="h-today"><h2 id="h-today">今日</h2><div id="today"></div></section>
      <section aria-labelledby="h-attn"><h2 id="h-attn">注意が必要なプロジェクト</h2><ul id="attn"></ul></section>
      <section aria-labelledby="h-proj"><h2 id="h-proj">プロジェクト</h2>
        <div role="group" aria-label="絞り込み" id="seg"></div><ul id="plist"></ul></section>
    </main>
  </div>
</div>
<script>
const TASKS = [{ id: 1, name: 'タスクA', done: false }, { id: 2, name: 'タスクB', done: false }];
const PROJECTS = [
  { name: '会員アプリ', st: 'attn' }, { name: '請求書自動化', st: 'ok' }, { name: 'ヘルプ移行', st: 'attn' }, { name: 'データ基盤', st: 'hold' },
];
const FILTERS = [['all', 'すべて'], ['attn', '要対応'], ['ok', '順調'], ['hold', '保留']];
let filter = 'all';
const $ = (id) => document.getElementById(id);
function renderTasks() {
  const left = TASKS.filter((t) => !t.done).length;
  $('today').innerHTML = (left === 0/*BUG:empty*/ ? '<p>今日の対応はすべて完了</p>' : '') +
    TASKS.map((t) => '<div class="row"><label><input type="checkbox" data-id="' + t.id + '"' + (t.done ? ' checked' : '') + '> ' + t.name + '</label></div>').join('') +
    '<p>残り ' + left + '件</p>';
}
function renderProjects() {
  $('attn').innerHTML = PROJECTS.filter((p) => p.st === 'attn').map((p) => '<li>' + p.name + '</li>').join('');
  $('seg').innerHTML = FILTERS.map(([k, l]) => '<button type="button" data-k="' + k + '" aria-pressed="' + (filter === k) + '">' + l + ' <small>' + PROJECTS.filter((p) => k === 'all' || p.st === k).length + '</small></button>').join('');
  $('plist').innerHTML = PROJECTS.filter((p) => filter === 'all' || p.st === filter /*BUG:filter*/).map((p) => '<li>' + p.name + '</li>').join('');
}
document.addEventListener('change', (e) => { const t = TASKS.find((x) => x.id == e.target.dataset.id); if (t) { t.done = e.target.checked; renderTasks(); } });
$('seg').addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) { filter = b.dataset.k; renderProjects(); } });
const btn = $('navToggle'), nav = $('sidenav');
const set = (open) => { nav.classList.toggle('open', open); btn.setAttribute('aria-expanded', String(open)); };
btn.addEventListener('click', () => set(btn.getAttribute('aria-expanded') !== 'true'));
document.addEventListener('keydown', (e) => { /*BUG:esc*/ if (e.key === 'Escape') set(false); });
renderTasks(); renderProjects();
/*BUG:jserror*/
</script>
</body></html>
